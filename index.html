<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>给老妈的母亲节惊喜</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* 1. 设置背景图 */
            background-image: linear-gradient(rgba(255, 245, 245, 0.7), rgba(255, 245, 245, 0.7)), url('mom.JPG');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            
            font-family: "Microsoft YaHei", "SimHei", sans-serif;
            overflow: hidden;
        }

        .container {
            position: relative;
            text-align: center;
        }

        /* 数学心形背景 */
        .heart-svg {
           width: 120px; /* 核心：缩小尺寸 */
            margin-top: 20px; /* 和文字拉开一点距离 */
            filter: drop-shadow(0 0 10px rgba(255, 0, 0, 0.3));
            animation: pulse 2s infinite ease-in-out;
            display: block; /* 确保居中 */
            margin-left: auto;
            margin-right: auto;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(255, 0, 0, 0.3)); }
            50% { transform: scale(1.05); filter: drop-shadow(0 0 30px rgba(255, 0, 0, 0.5)); }
        }

        /* 金色艺术字 */
        .art-text {
           width: 100%;
            pointer-events: none;
            display: flex; /* 变成弹性盒模型 */
            flex-direction: column; /* 内容纵向排列：文字在上，心在下 */
            align-items: center; /* 水平居中 */
            justify-content: center; /* 垂直居中 */
            height: auto; /* 高度自动 */
        }

        h1 {
            font-size: 48px; /* 字体稍微改小一点，更精致 */
            margin: 0 0 15px 0; /* 下方留点空隙给心形 */
            /* 以下保留原有的金色渐变效果 */
            background: linear-gradient(to bottom, #ffe08a 0%, #d4af37 50%, #8b6d10 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 8px rgba(255, 223, 0, 0.6));
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            letter-spacing: 5px;
        }

        /* 署名 */
        .signature {
            position: fixed;
            right: 50px;
            bottom: 50px;
            font-size: 24px;
            color: #888;
            font-style: italic;
        }

        /* 装饰用的小花瓣 */
        .petal {
            position: absolute;
            background: #ffc0cb;
            border-radius: 150% 0 150% 0;
            animation: drift 5s infinite linear;
            opacity: 0.6;
        }

        @keyframes drift {
            from { transform: translateY(-100vh) rotate(0deg); }
            to { transform: translateY(100vh) rotate(360deg); }
        }

        /* --- 音乐控制按钮样式 --- */
        #music-control {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.8);
            border: 2px solid rgba(212, 175, 55, 0.5); /* 加个淡金色边框 */
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 24px;
            z-index: 1000;
            transition: all 0.3s;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        /* 播放时图标旋转 */
        .rotating {
            animation: rotateIcon 4s linear infinite;
        }

        @keyframes rotateIcon {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        @media screen and (max-width: 768px) {
            h1 {
                font-size: 40px; /* 标题在手机上不要太宽，防止换行 */
            }

            .heart-svg {
                width: 100px; /* 心形稍微缩小一点点，给文字留空间 */
            }

            #music-control {
                width: 80px;  /* 手机端按钮做得非常大，方便手指点击 */
                height: 80px;
                top: 30px;
                right: 30px;
                font-size: 40px;
            }

            .signature {
                right: 20px;
                bottom: 30px;
                font-size: 28px; /* 署名在手机上显著加大 */
                background: rgba(255, 255, 255, 0.5); /* 给署名加个半透明底色，防止背景干扰 */
                padding: 5px 10px;
                border-radius: 10px;
            }
        }
    </style>
</head>
<body>

    <div id="music-control" onclick="toggleMusic()">
        <span id="music-icon">🎵</span>
    </div>

    <audio id="bg-music" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <div class="container">
        <svg class="heart-svg" viewBox="0 0 32 29.6">
            <path d="M23.6,0c-3.4,0-6.3,2.7-7.6,5.6C14.7,2.7,11.8,0,8.4,0C3.8,0,0,3.8,0,8.4c0,9.4,9.5,11.9,16,21.2
            c6.1-9.3,16-12.1,16-21.2C32,3.8,28.2,0,23.6,0z" fill="#ff4d4d"/>
        </svg>

        <div class="art-text">
            <h1>母亲节快乐!</h1>
        </div>
    </div>

    <div class="signature">- 你的儿子 李格羽</div>

    <script>
        // --- 音乐播放控制逻辑 ---
        const music = document.getElementById('bg-music');
        const musicControl = document.getElementById('music-control');

        function toggleMusic() {
            if (music.paused) {
                music.play();
                musicControl.classList.add('rotating');
            } else {
                music.pause();
                musicControl.classList.remove('rotating');
            }
        }

        // --- 飘落花瓣逻辑 ---
        function createPetal() {
            const petal = document.createElement('div');
            petal.className = 'petal';
            petal.style.left = Math.random() * 100 + 'vw';
            petal.style.width = Math.random() * 15 + 5 + 'px';
            petal.style.height = petal.style.width;
            petal.style.animationDuration = Math.random() * 3 + 2 + 's';
            document.body.appendChild(petal);
            setTimeout(() => petal.remove(), 5000);
        }
        setInterval(createPetal, 300);
    </script>
</body>
</html>
